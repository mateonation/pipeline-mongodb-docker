services:
  mysql:
    image: mysql
    container_name: mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: changeme 
      MYSQL_DATABASE: pipe
    ports:
      - "3306:3306"

  cassandra:
    image: cassandra
    container_name: cassandra
    restart: on-failure
    environment:
      CASSANDRA_CLUSTER_NAME: "pipe-cluster"
    ports:
      - "9042:9042"

  redis:
    image: redis
    restart: on-failure
    ports:
      - "6379:6379"
    command: redis-server --requirepass changeme 

  mongodb:
    image: mongo
    restart: on-failure
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: pipe
    ports:
      - "27017:27017"
